<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paketim</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #1e293b);
    color: white;
}

.container {
    max-width: 450px;
    margin: auto;
    padding: 25px 18px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.card {
    background: rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    outline: none;
    margin-bottom: 12px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: #22c55e;
    color: white;
}

button:hover {
    opacity: 0.9;
}

.error {
    color: #ff6b6b;
    font-size: 14px;
    margin-top: 5px;
    display: none;
}

.success {
    color: #4ade80;
    font-size: 14px;
    display: none;
}

.hidden {
    display: none;
}

.operator-info {
    font-size: 14px;
    color: #cbd5e1;
    margin-bottom: 12px;
}

.package {
    border: 2px solid transparent;
    background: rgba(255,255,255,0.07);
    padding: 14px;
    border-radius: 12px;
    margin: 8px 0;
    cursor: pointer;
}

.package:hover {
    border-color: #22c55e;
}

.package.selected {
    border-color: #22c55e;
    background: rgba(34,197,94,0.15);
}

.price {
    float: right;
    font-weight: bold;
    color: #4ade80;
}
</style>
</head>

<body>

<div class="container">

    <h1>📱 Paketim</h1>

    <!-- Operator -->
    <div class="card">
        <label>Operatoru seçin</label>

        <select id="operator">
            <option value="">Operator seçin</option>
            <option value="azercell">Azercell</option>
            <option value="bakcell">Bakcell</option>
            <option value="nar">Nar</option>
        </select>

        <div id="operatorInfo" class="operator-info"></div>
    </div>


    <!-- Paket -->
    <div class="card">

        <label>Paket seçin</label>

        <div class="package" data-price="3">
            5 GB <span class="price">3 AZN</span>
        </div>

        <div class="package" data-price="7">
            10 GB <span class="price">7 AZN</span>
        </div>

        <div class="package" data-price="10">
            15 GB <span class="price">10 AZN</span>
        </div>

        <div class="package" data-price="20">
            40 GB <span class="price">20 AZN</span>
        </div>

        <div class="package" data-price="30">
            80 GB <span class="price">30 AZN</span>
        </div>

        <div id="packageError" class="error">
            Zəhmət olmasa paket seçin.
        </div>

    </div>


    <!-- Telefon -->
    <div class="card">

        <label>Mobil nömrə</label>

        <input
            type="tel"
            id="phone"
            placeholder="050-123-45-67"
            maxlength="12"
            inputmode="numeric"
            autocomplete="tel"
        >

        <div id="phoneError" class="error"></div>

        <div id="phoneSuccess" class="success">
            ✓ Nömrə düzgündür
        </div>

    </div>


    <!-- Ödəniş -->
    <div id="paymentSection" class="card hidden">

        <h2>💳 Ödəniş</h2>

        <p>
            Seçilmiş paket:
            <strong id="selectedPackage"></strong>
        </p>

        <p>
            Nömrə:
            <strong id="selectedPhone"></strong>
        </p>

        <p>
            Məbləğ:
            <strong id="selectedPrice"></strong>
        </p>

        <button onclick="confirmPayment()">
            Ödənişə davam et
        </button>

    </div>

</div>


<script>

const operator = document.getElementById("operator");
const phone = document.getElementById("phone");
const phoneError = document.getElementById("phoneError");
const phoneSuccess = document.getElementById("phoneSuccess");
const paymentSection = document.getElementById("paymentSection");
const operatorInfo = document.getElementById("operatorInfo");

let selectedPackage = null;


/* Operator prefiksləri */

const prefixes = {
    azercell: ["050", "051"],
    bakcell: ["055", "099"],
    nar: ["070", "077"]
};


/* Operator seçimi */

operator.addEventListener("change", function() {

    phone.value = "";
    phoneError.style.display = "none";
    phoneSuccess.style.display = "none";
    paymentSection.classList.add("hidden");

    if (!this.value) {
        operatorInfo.textContent = "";
        return;
    }

    operatorInfo.textContent =
        "İcazə verilən prefikslər: " +
        prefixes[this.value].join(" / ");

});


/* Paket seçimi */

document.querySelectorAll(".package").forEach(function(pkg) {

    pkg.addEventListener("click", function() {

        document.querySelectorAll(".package")
        .forEach(function(item) {
            item.classList.remove("selected");
        });

        this.classList.add("selected");

        selectedPackage = {
            name: this.textContent.trim(),
            price: this.dataset.price
        };

        document.getElementById("packageError").style.display = "none";

        checkPhone();

    });

});


/* Nömrəni avtomatik formatlama */

phone.addEventListener("input", function() {

    let numbers = this.value.replace(/\D/g, "");

    /* Azərbaycanda nömrə 10 rəqəm olur */

    if (numbers.length > 10) {
        numbers = numbers.substring(0, 10);
    }

    let formatted = "";

    if (numbers.length > 0) {
        formatted += numbers.substring(0, 3);
    }

    if (numbers.length > 3) {
        formatted += "-" + numbers.substring(3, 6);
    }

    if (numbers.length > 6) {
        formatted += "-" + numbers.substring(6, 8);
    }

    if (numbers.length > 8) {
        formatted += "-" + numbers.substring(8, 10);
    }

    this.value = formatted;

    checkPhone();

});


/* Nömrəni yoxlama */

function checkPhone() {

    const selectedOperator = operator.value;

    if (!selectedOperator) {
        phoneError.textContent = "Əvvəlcə operatoru seçin.";
        phoneError.style.display = "block";
        phoneSuccess.style.display = "none";
        paymentSection.classList.add("hidden");
        return false;
    }

    const numbers = phone.value.replace(/\D/g, "");

    /* 10 rəqəm yoxdursa */

    if (numbers.length < 10) {

        phoneError.textContent =
            "Nömrə 10 rəqəmdən ibarət olmalıdır.";

        phoneError.style.display = "block";
        phoneSuccess.style.display = "none";
        paymentSection.classList.add("hidden");

        return false;
    }


    /* Prefiksi yoxla */

    const prefix = numbers.substring(0, 3);

    if (!prefixes[selectedOperator].includes(prefix)) {

        phoneError.textContent =
            "Bu nömrə seçilmiş operatora aid deyil.";

        phoneError.style.display = "block";
        phoneSuccess.style.display = "none";
        paymentSection.classList.add("hidden");

        return false;
    }


    /* Nömrə düzgündür */

    phoneError.style.display = "none";
    phoneSuccess.style.display = "block";

    showPayment();

    return true;
}


/* Ödəniş bölməsini göstər */

function showPayment() {

    if (!selectedPackage) {
        return;
    }

    document.getElementById("selectedPackage").textContent =
        selectedPackage.name;

    document.getElementById("selectedPhone").textContent =
        phone.value;

    document.getElementById("selectedPrice").textContent =
        selectedPackage.price + " AZN";

    paymentSection.classList.remove("hidden");

}


/* Ödəniş */

function confirmPayment() {

    if (!selectedPackage) {
        document.getElementById("packageError").style.display = "block";
        return;
    }

    if (!checkPhone()) {
        return;
    }

    alert(
        "Məlumatlar qəbul edildi.\n\n" +
        "Nömrə: " + phone.value + "\n" +
        "Məbləğ: " + selectedPackage.price + " AZN"
    );

}

</script>

</body>
</html>
