<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paketim</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #1e293b);
    color: white;
}

.container {
    max-width: 450px;
    margin: auto;
    padding: 25px 18px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.card {
    background: rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    outline: none;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    background: #22c55e;
    color: white;
}

.error {
    color: #ff6b6b;
    font-size: 14px;
    margin-top: 5px;
    display: none;
}

.success {
    color: #4ade80;
    font-size: 14px;
    display: none;
}

.hidden {
    display: none;
}

.operator-info {
    font-size: 14px;
    color: #cbd5e1;
    margin-top: 5px;
}

.package {
    padding: 15px;
    margin: 8px 0;
    border: 2px solid transparent;
    border-radius: 12px;
    background: rgba(255,255,255,0.07);
    cursor: pointer;
}

.package.selected {
    border-color: #22c55e;
    background: rgba(34,197,94,0.15);
}

.price {
    float: right;
    color: #4ade80;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>📱 Paketim</h1>

<div class="card">

<label>Operatoru seçin</label>

<select id="operator">
<option value="">Operator seçin</option>
<option value="azercell">Azercell</option>
<option value="bakcell">Bakcell</option>
<option value="nar">Nar</option>
</select>

<div id="operatorInfo" class="operator-info"></div>

</div>


<div class="card">

<label>Paket seçin</label>

<div class="package" data-name="5 GB" data-price="3">
5 GB
<span class="price">3 AZN</span>
</div>

<div class="package" data-name="10 GB" data-price="7">
10 GB
<span class="price">7 AZN</span>
</div>

<div class="package" data-name="15 GB" data-price="10">
15 GB
<span class="price">10 AZN</span>
</div>

<div class="package" data-name="40 GB" data-price="20">
40 GB
<span class="price">20 AZN</span>
</div>

<div class="package" data-name="80 GB" data-price="30">
80 GB
<span class="price">30 AZN</span>
</div>

<div id="packageError" class="error">
Zəhmət olmasa paket seçin.
</div>

</div>


<div class="card">

<label>Mobil nömrə</label>

<input
type="tel"
id="phone"
placeholder="050-123-45-67"
maxlength="13"
inputmode="numeric"
autocomplete="tel"
>

<div id="phoneError" class="error"></div>

<div id="phoneSuccess" class="success">
✓ Nömrə düzgündür
</div>

</div>


<div id="paymentSection" class="card hidden">

<h2>💳 Ödəniş</h2>

<p>
Paket:
<strong id="selectedPackage"></strong>
</p>

<p>
Nömrə:
<strong id="selectedPhone"></strong>
</p>

<p>
Məbləğ:
<strong id="selectedPrice"></strong>
</p>

<button onclick="confirmPayment()">
Ödənişə davam et
</button>

</div>

</div>


<script>

const operator = document.getElementById("operator");
const phone = document.getElementById("phone");
const phoneError = document.getElementById("phoneError");
const phoneSuccess = document.getElementById("phoneSuccess");
const paymentSection = document.getElementById("paymentSection");
const operatorInfo = document.getElementById("operatorInfo");
const packageError = document.getElementById("packageError");

let selectedPackage = null;


/* Operator prefiksləri */

const prefixes = {

    azercell: ["050", "051"],

    bakcell: ["055", "099"],

    nar: ["070", "077"]

};


/* Operator seçimi */

operator.addEventListener("change", function() {

    phone.value = "";

    phoneError.style.display = "none";

    phoneSuccess.style.display = "none";

    paymentSection.classList.add("hidden");

    if (this.value === "") {

        operatorInfo.textContent = "";

        return;

    }

    operatorInfo.textContent =
        "İcazə verilən kodlar: " +
        prefixes[this.value].join(" / ");

});


/* Paket seçimi */

document.querySelectorAll(".package").forEach(function(pkg) {

    pkg.addEventListener("click", function() {

        document.querySelectorAll(".package").forEach(function(item) {

            item.classList.remove("selected");

        });

        this.classList.add("selected");

        selectedPackage = {

            name: this.dataset.name,

            price: this.dataset.price

        };

        packageError.style.display = "none";

        checkPhone();

    });

});


/* Nömrə daxil edilməsi */

phone.addEventListener("input", function() {

    let numbers = this.value.replace(/\D/g, "");

    /*
       Azərbaycan mobil nömrəsi:
       0501234567 = 10 rəqəm
    */

    if (numbers.length > 10) {

        numbers = numbers.substring(0, 10);

    }


    let formatted = "";


    /* 050 */

    if (numbers.length > 0) {

        formatted = numbers.substring(0, 3);

    }


    /* 123 */

    if (numbers.length > 3) {

        formatted += "-" + numbers.substring(3, 6);

    }


    /* 45 */

    if (numbers.length > 6) {

        formatted += "-" + numbers.substring(6, 8);

    }


    /* 67 */

    if (numbers.length > 8) {

        formatted += "-" + numbers.substring(8, 10);

    }


    phone.value = formatted;

    checkPhone();

});


/* Nömrəni yoxla */

function checkPhone() {

    const selectedOperator = operator.value;


    if (selectedOperator === "") {

        phoneError.textContent =
            "Əvvəlcə operatoru seçin.";

        phoneError.style.display = "block";

        phoneSuccess.style.display = "none";

        paymentSection.classList.add("hidden");

        return false;

    }


    const numbers = phone.value.replace(/\D/g, "");


    /* Tam 10 rəqəm olmalıdır */

    if (numbers.length !== 10) {

        phoneError.textContent =
            "Nömrə 10 rəqəmdən ibarət olmalıdır.";

        phoneError.style.display = "block";

        phoneSuccess.style.display = "none";

        paymentSection.classList.add("hidden");

        return false;

    }


    /* Operator kodunu yoxla */

    const prefix = numbers.substring(0, 3);


    if (!prefixes[selectedOperator].includes(prefix)) {

        phoneError.textContent =
            "Bu nömrə seçilmiş operatora aid deyil.";

        phoneError.style.display = "block";

        phoneSuccess.style.display = "none";

        paymentSection.classList.add("hidden");

        return false;

    }


    /* Nömrə düzgündür */

    phoneError.style.display = "none";

    phoneSuccess.style.display = "block";


    if (selectedPackage !== null) {

        showPayment();

    }


    return true;

}


/* Ödəniş bölməsi */

function showPayment() {

    document.getElementById("selectedPackage").textContent =
        selectedPackage.name;

    document.getElementById("selectedPhone").textContent =
        phone.value;

    document.getElementById("selectedPrice").textContent =
        selectedPackage.price + " AZN";

    paymentSection.classList.remove("hidden");

}


/* Ödənişə davam */

function confirmPayment() {

    if (selectedPackage === null) {

        packageError.style.display = "block";

        return;

    }


    if (!checkPhone()) {

        return;

    }


    alert(
        "Məlumatlar qəbul edildi.\n\n" +
        "Nömrə: " + phone.value + "\n" +
        "Paket: " + selectedPackage.name + "\n" +
        "Məbləğ: " + selectedPackage.price + " AZN"
    );

}

</script>

</body>
</html>
